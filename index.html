<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マック価格マップ｜全国ビッグマック価格帯調査</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:        #0f0f0f;
  --surface:   #1a1a1a;
  --border:    #2a2a2a;
  --text:      #e8e8e8;
  --text-sub:  #888;
  --accent:    #f0c040;
  --pin-standard:   #4caf8a;
  --pin-semi-urban: #f0a030;
  --pin-urban:      #e05050;
  --pin-special:    #9060e0;
  --sidebar-w: 260px;
  --header-h:  52px;
  --ad-bottom-h: 60px; /* スマホ下部広告の高さ */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

/* Layout */
#app {
  display: grid;
  height: 100vh;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-areas: "header header" "sidebar map";
}

/* Header */
#header {
  grid-area: header;
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
}
#header .logo { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--accent); letter-spacing: .05em; white-space: nowrap; }
#header .tagline { font-size: 11px; color: var(--text-sub); white-space: nowrap; }
#header .spacer { flex: 1; }
.legend { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-sub); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* Sidebar */
#sidebar {
  grid-area: sidebar;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
#sidebar-title {
  padding: 14px 14px 10px;
  font-size: 11px; font-weight: 700; color: var(--text-sub);
  letter-spacing: .1em; text-transform: uppercase;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#pref-list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.pref-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 14px; cursor: pointer;
  border-bottom: 1px solid transparent;
  border-left: 2px solid transparent;
  transition: background .12s; gap: 8px;
}
.pref-item:hover { background: rgba(255,255,255,.04); }
.pref-item.active { background: rgba(240,192,64,.08); border-left-color: var(--accent); }
.pref-name { font-size: 13px; flex: 1; }
.pref-freshness {
  font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-sub);
  white-space: nowrap; padding: 2px 5px; background: var(--border); border-radius: 3px;
}
.pref-freshness.fresh   { color: #4caf8a; background: rgba(76,175,138,.1); }
.pref-freshness.stale   { color: #f0a030; background: rgba(240,160,48,.1); }
.pref-freshness.old     { color: #e05050; background: rgba(224,80,80,.1); }
.pref-freshness.no-data { color: var(--text-sub); }

/* 広告枠（サイドバー中間） */
.ad-sidebar {
  margin: 8px 10px;
  height: 90px;
  background: rgba(255,255,255,.03);
  border: 1px dashed var(--border);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 4px;
  flex-shrink: 0;
}
.ad-label { font-size: 9px; color: var(--text-sub); letter-spacing: .08em; text-transform: uppercase; }

#sidebar-footer {
  padding: 10px 14px; font-size: 10px; color: var(--text-sub);
  border-top: 1px solid var(--border); line-height: 1.6; flex-shrink: 0;
}

/* Map */
#map-wrap { grid-area: map; position: relative; }
#map { width: 100%; height: 100%; background: #141414; }

/* Mobile top bar */
#mobile-bar {
  display: none;
  position: absolute; top: 10px; left: 10px; right: 10px;
  z-index: 900; gap: 6px;
}
#pref-select-mobile {
  flex: 1; appearance: none;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 12px;
  font-family: 'Noto Sans JP', sans-serif; font-size: 13px;
  outline: none; cursor: pointer;
}
#pref-select-mobile:focus { border-color: var(--accent); }

/* FAB */
#locate-btn {
  position: absolute;
  bottom: 32px; right: 12px;
  z-index: 900;
  width: 48px; height: 48px; border-radius: 50%;
  border: none; background: var(--accent); color: #000;
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.5);
  transition: transform .15s, box-shadow .15s;
}
#locate-btn:hover { transform: scale(1.08); box-shadow: 0 5px 18px rgba(0,0,0,.6); }
#locate-btn:active { transform: scale(.95); }

/* スマホ下部固定広告 */
#ad-bottom {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--ad-bottom-h);
  background: rgba(26,26,26,.97);
  border-top: 1px solid var(--border);
  z-index: 1000;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 2px;
}
#ad-bottom .ad-label { font-size: 9px; color: var(--text-sub); letter-spacing: .08em; }

/* Loading */
#loading {
  display: none; position: absolute; inset: 0;
  background: rgba(15,15,15,.65); z-index: 1100;
  align-items: center; justify-content: center; flex-direction: column; gap: 10px;
  font-size: 13px; color: var(--text-sub);
}
#loading.active { display: flex; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Popup */
.mac-popup { font-family: 'Noto Sans JP', sans-serif; min-width: 180px; }
.mac-popup .p-name { font-size: 13px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }
.mac-popup .p-price { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.mac-popup .p-tier { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 3px; margin-bottom: 6px; font-weight: 700; letter-spacing: .05em; }
.mac-popup .p-meta { font-size: 11px; color: #888; line-height: 1.6; }
.tier-standard   { background: rgba(76,175,138,.2);  color: #4caf8a; }
.tier-semi-urban { background: rgba(240,160,48,.2);  color: #f0a030; }
.tier-urban      { background: rgba(224,80,80,.2);   color: #e05050; }
.tier-special    { background: rgba(144,96,224,.2);  color: #9060e0; }
.tier-unknown    { background: rgba(100,100,100,.2); color: #888; }

/* Responsive */
@media (max-width: 680px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-areas: "header" "map";
  }
  #sidebar { display: none; }
  #mobile-bar { display: flex; }
  #ad-bottom { display: flex; }
  #locate-btn { bottom: calc(var(--ad-bottom-h) + 14px); } /* 広告の上に浮かせる */
  #map { height: calc(100vh - var(--header-h) - var(--ad-bottom-h)); }
}
</style>
</head>

<div id="app">

  <header id="header">
    <span class="logo">McPriceMap</span>
    <span class="tagline">全国ビッグマック価格帯マップ</span>
    <div class="spacer"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--pin-standard)"></div>¥500 通常</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--pin-semi-urban)"></div>¥530 準都心</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--pin-urban)"></div>¥560 都心</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--pin-special)"></div>¥590+ 特殊</div>
    </div>
  </header>

  <aside id="sidebar">
    <div id="sidebar-title">都道府県 / 鮮度</div>
    <div id="pref-list"></div>
    <div id="sidebar-footer">
      ※ 全国約3,000店舗を約24日で巡回調査。<br>
      掲載価格は調査時点のものです。<br>
      最新情報は公式アプリでご確認ください。
    </div>

  <div id="map-wrap">
    <div id="mobile-bar">

    </div>
    <div id="map"></div>
    <button id="locate-btn" title="現在地から探す">⊕</button>
    <div id="loading"><div class="spinner"></div><span id="loading-text">読み込み中...</span></div>
  </div>

</div>

<!-- スマホ下部固定広告 -->
<div id="ad-bottom">
  <div class="ad-label">Advertisement</div>
  <!-- ここにAdSenseコードを挿入 -->
  <div style="font-size:11px;color:#555;">広告枠（320×50）</div>
</div>

<script>
// ============================================================
// 設定
// ============================================================
const PREFECTURE_CONFIG = {

  "41":{"name":"佐賀県","bounds":[[33.00,129.65],[33.60,130.55]]},
  "42":{"name":"長崎県","bounds":[[32.55,128.55],[34.75,130.30]]},
  "43":{"name":"熊本県","bounds":[[32.05,130.05],[33.20,131.35]]},
  "44":{"name":"大分県","bounds":[[32.75,130.90],[33.70,132.10]]},
  "45":{"name":"宮崎県","bounds":[[31.35,130.65],[32.85,132.00]]},
  "46":{"name":"鹿児島県","bounds":[[30.00,129.25],[32.30,131.25]]},
  "47":{"name":"沖縄県","bounds":[[24.00,122.90],[27.10,131.35]]},
};

const TIER_COLORS = { standard:'#4caf8a', semi_urban:'#f0a030', urban:'#e05050', special:'#9060e0' };
const TIER_LABELS = { standard:'通常 ¥500', semi_urban:'準都心 ¥530', urban:'都心 ¥560', special:'特殊立地 ¥590+' };

// ============================================================
// 状態
// ============================================================
const state = {
  currentPref: null,
  summaryGroup: null,    // all_summary.json によるクラスタ（軽量）
  detailGroup: null,     // shops_XX.json による詳細クラスタ
  detailCache: {},       // { "13": [...] } 詳細データキャッシュ
  prefetchQueue: [],     // バックグラウンド先読みキュー
  prefetching: false,
};

// ============================================================
// 地図
// ============================================================
const map = L.map('map', { center:[36.5,137.5], zoom:5, zoomControl:true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
  maxZoom:19,
}).addTo(map);
map.scrollWheelZoom.disable();
map.on('focus', () => map.scrollWheelZoom.enable());
map.on('blur',  () => map.scrollWheelZoom.disable());

// ============================================================
// ユーティリティ
// ============================================================
function getFreshnessLabel(isoStr) {
  if (!isoStr) return { label:'データなし', cls:'no-data' };
  const h = (Date.now() - new Date(isoStr)) / 3600000;
  const d = h / 24;
  if (h < 1)  return { label:'1時間以内', cls:'fresh' };
  if (h < 24) return { label:`${Math.floor(h)}時間前`, cls:'fresh' };
  if (d < 3)  return { label:`${Math.floor(d)}日前`, cls:'fresh' };
  if (d < 14) return { label:`${Math.floor(d)}日前`, cls:'stale' };
  return { label:`${Math.floor(d)}日前`, cls:'old' };
}

function makeSummaryIcon(tier) {
  const color = TIER_COLORS[tier] || '#666';
  return L.circleMarker(null, {}); // ダミー（後でlatLngを渡す）
}

function makeDetailIcon(tier) {
  const color = TIER_COLORS[tier] || '#666';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="28" viewBox="0 0 20 28">
    <path d="M10 0C4.5 0 0 4.5 0 10c0 7.5 10 18 10 18s10-10.5 10-18C20 4.5 15.5 0 10 0z" fill="${color}" opacity=".92"/>
    <circle cx="10" cy="10" r="4" fill="white" opacity=".9"/>
  </svg>`;
  return L.divIcon({ html:svg, className:'', iconSize:[20,28], iconAnchor:[10,28], popupAnchor:[0,-28] });
}

function clusterIcon(cluster) {
  const count = cluster.getChildCount();
  return L.divIcon({
    html:`<div style="background:rgba(240,192,64,.85);color:#000;font-family:'DM Mono',monospace;font-weight:500;font-size:${count>99?11:13}px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)">${count}</div>`,
    className:'', iconSize:[36,36], iconAnchor:[18,18],
  });
}

function makeTierClass(tier) {
  if (!tier) return 'tier-unknown';
  if (tier.startsWith('special_')) return 'tier-special';
  return 'tier-' + tier.replace('_','-');
}

function makeTierLabel(tier, price) {
  if (!tier) return 'データなし';
  if (tier.startsWith('special_')) return `特殊立地 ¥${price}`;
  return TIER_LABELS[tier] || tier;
}

function formatDate(iso) {
  if (!iso) return '不明';
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function showLoading(text='読み込み中...') {
  document.getElementById('loading-text').textContent = text;
  document.getElementById('loading').classList.add('active');
}
function hideLoading() { document.getElementById('loading').classList.remove('active'); }

// ============================================================
// Phase 1: サマリーで全国を初期表示（軽量・クリック不可）
// ============================================================
async function loadSummary() {
  showLoading('全国データを読み込み中...');
  try {
    const res = await fetch('data/all_summary.json');
    if (!res.ok) throw new Error('summary not found');
    const shops = await res.json();

    state.summaryGroup = L.markerClusterGroup({
      maxClusterRadius: 60,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      iconCreateFunction: clusterIcon,
    });

    for (const s of shops) {
      if (!s.coords) continue;
      const color = TIER_COLORS[s.price_tier] || '#666';
      // 軽量な circleMarker（SVGなし）
      const m = L.circleMarker(s.coords, {
        radius: 5, color: '#000', weight: 1,
        fillColor: color, fillOpacity: 0.85,
      });
      // クリック時: 詳細データを読み込んで切り替え
      m.on('click', () => {
        const code = String(s.prefecture_code).padStart(2,'0');
        selectPref(code);
      });
      state.summaryGroup.addLayer(m);
    }

    map.addLayer(state.summaryGroup);

    // 鮮度情報はサマリーからは取れないのでサイドバーは別途更新
    return shops;
  } catch(e) {
    console.warn('all_summary.json なし。個別JSONにフォールバックします。', e);
    return null;
  } finally {
    hideLoading();
  }
}

// ============================================================
// Phase 2: 詳細データの読み込みとマーカー切り替え
// ============================================================
async function fetchDetail(code) {
  if (state.detailCache[code]) return state.detailCache[code];
  try {
    const res = await fetch(`data/shops_${code}.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const shops = await res.json();
    state.detailCache[code] = shops;
    return shops;
  } catch(e) {
    console.warn(`shops_${code}.json 読み込み失敗`, e);
    return null;
  }
}

function renderDetailMarkers(shops, code) {
  // 既存の詳細レイヤーを削除
  if (state.detailGroup) map.removeLayer(state.detailGroup);

  state.detailGroup = L.markerClusterGroup({
    maxClusterRadius: 50,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    iconCreateFunction: clusterIcon,
  });

  for (const shop of shops) {
    if (!shop.coords || shop.coords.length < 2) continue;
    const tier = shop.price_tier || null;
    const marker = L.marker(shop.coords, { icon: makeDetailIcon(tier) });

    const tierCls   = makeTierClass(tier);
    const tierLabel = makeTierLabel(tier, shop.bigmac_price);
    const priceStr  = shop.bigmac_price ? `¥${shop.bigmac_price}` : '価格データなし';
    const fresh     = getFreshnessLabel(shop.scraped_at);

    marker.bindPopup(`
      <div class="mac-popup">
        <div class="p-name">${shop.name}</div>
        <div class="p-price">${priceStr}</div>
        <span class="p-tier ${tierCls}">${tierLabel}</span>
        <div class="p-meta">
          ${shop.address || ''}<br>
          🕐 ${formatDate(shop.scraped_at)}（${fresh.label}）
        </div>
      </div>
    `, { maxWidth:260 });

    state.detailGroup.addLayer(marker);
  }
  map.addLayer(state.detailGroup);
}

// ============================================================
// バックグラウンド先読み（ユーザーに気づかれないように隣県を先読み）
// ============================================================
async function prefetchNeighbors(selectedCode) {
  // 選択県の前後2県を先読みキューに追加（隣接の近似として）
  const codes = Object.keys(PREFECTURE_CONFIG);
  const idx = codes.indexOf(selectedCode);
  const targets = [
    codes[idx - 2], codes[idx - 1],
    codes[idx + 1], codes[idx + 2],
  ].filter(Boolean).filter(c => !state.detailCache[c]);

  state.prefetchQueue.push(...targets.filter(c => !state.prefetchQueue.includes(c)));

  if (state.prefetching) return;
  state.prefetching = true;

  // アイドル時に順次先読み（1件ずつ、間隔を空けてサーバー負荷を避ける）
  while (state.prefetchQueue.length > 0) {
    const code = state.prefetchQueue.shift();
    if (!state.detailCache[code]) {
      await fetchDetail(code);
      await new Promise(r => setTimeout(r, 800)); // 800ms間隔
    }
  }
  state.prefetching = false;
}

// ============================================================
// 都道府県選択
// ============================================================
async function selectPref(code) {
  if (!PREFECTURE_CONFIG[code]) return;
  state.currentPref = code;

  document.querySelectorAll('.pref-item').forEach(el =>
    el.classList.toggle('active', el.dataset.code === code)
  );
  document.getElementById('pref-select-mobile').value = code;

  showLoading(`${PREFECTURE_CONFIG[code].name}の詳細を読み込み中...`);
  const shops = await fetchDetail(code);
  hideLoading();

  if (!shops) return;

  renderDetailMarkers(shops, code);
  map.fitBounds(PREFECTURE_CONFIG[code].bounds, { padding:[20,20] });

  // 鮮度をサイドバーに反映
  const latestIso = shops.reduce((l, s) => (!l || s.scraped_at > l) ? s.scraped_at : l, null);
  updateFreshness(code, latestIso);

  // バックグラウンドで隣県を先読み開始
  prefetchNeighbors(code);
}

// ============================================================
// サイドバー・セレクト生成
// ============================================================
function updateFreshness(code, isoStr) {
  const { label, cls } = getFreshnessLabel(isoStr);
  const el = document.getElementById(`fresh-${code}`);
  if (el) { el.textContent = label; el.className = `pref-freshness ${cls}`; }
  const opt = document.getElementById(`opt-${code}`);
  if (opt) opt.textContent = `${PREFECTURE_CONFIG[code].name}  [${label}]`;
}

function buildSidebar() {
  const list = document.getElementById('pref-list');
  const mobileSelect = document.getElementById('pref-select-mobile');
  const codes = Object.keys(PREFECTURE_CONFIG);

  // 広告を挿入する位置（全47件の中間あたり）
  const adPosition = Math.floor(codes.length / 2);

  codes.forEach((code, i) => {
    const cfg = PREFECTURE_CONFIG[code];

    // サイドバー中間に広告枠を挟む
    if (i === adPosition) {
      const adEl = document.createElement('div');
      adEl.className = 'ad-sidebar';
      adEl.innerHTML = `
        <div class="ad-label">Advertisement</div>
        <!-- ここにAdSenseコードを挿入 -->
        <div style="font-size:11px;color:#555;">広告枠（234×60）</div>
      `;
      list.appendChild(adEl);
    }

    const item = document.createElement('div');
    item.className = 'pref-item';
    item.dataset.code = code;
    item.innerHTML = `
      <span class="pref-name">${cfg.name}</span>
      <span class="pref-freshness no-data" id="fresh-${code}">…</span>
    `;
    item.addEventListener('click', () => selectPref(code));
    list.appendChild(item);

    const opt = document.createElement('option');
    opt.value = code;
    opt.id = `opt-${code}`;
    opt.textContent = cfg.name;
    mobileSelect.appendChild(opt);
  });

  // 詳細データが先読みされたら鮮度を更新
  // （サマリーには scraped_at がないため、詳細読み込み時に随時反映）
}

// ============================================================
// ズームイベント：一定以上ズームしたら現在表示エリアの詳細を先読み
// ============================================================
map.on('zoomend', () => {
  if (map.getZoom() < 9) return; // 県レベル以上のズームでのみ動作
  const center = map.getCenter();
  const code = detectPrefFromCoords(center.lat, center.lng);
  if (code && !state.detailCache[code]) {
    fetchDetail(code); // バックグラウンドで静かに先読み
  }
});

// ============================================================
// 現在地ボタン
// ============================================================
document.getElementById('locate-btn').addEventListener('click', () => {
  if (!navigator.geolocation) { alert('位置情報に対応していません。'); return; }
  showLoading('現在地を取得中...');
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const { latitude:lat, longitude:lng } = pos.coords;
      L.circleMarker([lat,lng], {
        radius:8, color:'#fff', fillColor:'#f0c040', fillOpacity:1, weight:2,
      }).addTo(map).bindPopup('📍 現在地').openPopup();
      map.setView([lat,lng], 13);
      hideLoading();
      const code = detectPrefFromCoords(lat, lng);
      if (code) {
        const shops = await fetchDetail(code);
        if (shops) { renderDetailMarkers(shops, code); updateFreshness(code, shops.reduce((l,s)=>(!l||s.scraped_at>l)?s.scraped_at:l,null)); }
      }
    },
    err => {
      hideLoading();
      const msgs = {1:'位置情報の利用が許可されていません。',2:'位置情報を取得できませんでした。',3:'タイムアウトしました。'};
      alert(msgs[err.code] || '位置情報の取得に失敗しました。');
    },
    { timeout:10000, maximumAge:60000 }
  );
});

function detectPrefFromCoords(lat, lng) {
  for (const [code, cfg] of Object.entries(PREFECTURE_CONFIG)) {
    const [[s,w],[n,e]] = cfg.bounds;
    if (lat>=s && lat<=n && lng>=w && lng<=e) return code;
  }
  return null;
}

document.getElementById('pref-select-mobile').addEventListener('change', e => {
  if (e.target.value) selectPref(e.target.value);
});

// ============================================================
// 起動
// ============================================================
buildSidebar();
loadSummary();
</script>
</body>
